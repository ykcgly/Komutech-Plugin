# ============================================================
# 口木科技 附属配置
# 本文件由插件首次启动时自动生成到 plugins/Komutech/config.yml
# 生成后请直接编辑 plugins/Komutech/config.yml，升级不会被覆盖
# 修改后重启服务器生效
# ============================================================

# 每位玩家可拥有的最大存储数量
L_ZJ_WXG_CCmax: 5
# 禁止存入的物品ID列表
L_ZJ_WXG_BAN:
- KOMUTECH_L_ZJ_萬衍儀
- KOMUTECH_L_ZJ_萬象匱

# ----------------------------------------------------------
# 高危操作密码（安全相关，务必配置）
# 留空 = 该高危操作被禁用，插件会在控制台打印告警提示
# ----------------------------------------------------------

# 萬象匱「清空所有存储」确认密码
# 安全提示：本插件不再内置任何默认密码，请自行设置一个强密码。
# 若留空，执行「清空全部存储」时会被直接拒绝。
L_ZJ_WXG_MM: ""

# 管理员「删除玩家存储」确认密码
# 安全提示：删除操作需要校验此密码（原实现仅要求输入「确认删除」四字，过于宽松）。
# 若留空，所有删除玩家存储的操作都会被拒绝。
KOMUTECH_WJSX_MM: ""

# 属性成长系数
KOMUTECH_WJSX_SXCZZ:
  血量: 3.0
  攻击力: 1.0
  防御力: 1.0
  速度: 0.1
  灵识: 0.01
  灵力: 0.1
